<svg xmlns="http://www.w3.org/2000/svg" width="680" viewBox="0 0 680 450" role="img"><title>Where the brake lines run on the Bakfiets</title><desc>Side view of the bike. The rear brake line runs from the handlebars toward the rear wheel, where the brake type is still undecided. Two example routes run from the handlebars to the front brake caliper at the front axle: one over the cargo box, one along the frame under it.</desc>
