<svg xmlns="http://www.w3.org/2000/svg" width="680" viewBox="0 0 680 420" role="img"><title>Inside a direct-drive hub motor</title><desc>Cross-section of the hub motor. The axle and the stator coils are fixed to the frame. The shell, with magnets on its inside, spins around them and drives the wheel through the spokes.</desc>
<g stroke="#808080" stroke-width="1.2" opacity="0.6"><line x1="210" y1="90" x2="210" y2="20"/><line x1="210" y1="330" x2="210" y2="400"/><line x1="90" y1="210" x2="20" y2="210"/><line x1="330" y1="210" x2="400" y2="210"/></g>
<circle cx="210" cy="210" r="120" fill="none" stroke="#808080" stroke-width="7"/>
<g><rect x="313.0" y="204.0" width="12" height="12" rx="2" fill="#E24B4A" transform="rotate(0.0 319.0 210.0)"/><rect x="304.7" y="245.7" width="12" height="12" rx="2" fill="#378ADD" transform="rotate(22.5 310.7 251.7)"/><rect x="281.1" y="281.1" width="12" height="12" rx="2" fill="#E24B4A" transform="rotate(45.0 287.1 287.1)"/><rect x="245.7" y="304.7" width="12" height="12" rx="2" fill="#378ADD" transform="rotate(67.5 251.7 310.7)"/><rect x="204.0" y="313.0" width="12" height="12" rx="2" fill="#E24B4A" transform="rotate(90.0 210.0 319.0)"/><rect x="162.3" y="304.7" width="12" height="12" rx="2" fill="#378ADD" transform="rotate(112.5 168.3 310.7)"/><rect x="126.9" y="281.1" width="12" height="12" rx="2" fill="#E24B4A" transform="rotate(135.0 132.9 287.1)"/><rect x="103.3" y="245.7" width="12" height="12" rx="2" fill="#378ADD" transform="rotate(157.5 109.3 251.7)"/><rect x="95.0" y="204.0" width="12" height="12" rx="2" fill="#E24B4A" transform="rotate(180.0 101.0 210.0)"/><rect x="103.3" y="162.3" width="12" height="12" rx="2" fill="#378ADD" transform="rotate(202.5 109.3 168.3)"/><rect x="126.9" y="126.9" width="12" height="12" rx="2" fill="#E24B4A" transform="rotate(225.0 132.9 132.9)"/><rect x="162.3" y="103.3" width="12" height="12" rx="2" fill="#378ADD" transform="rotate(247.5 168.3 109.3)"/><rect x="204.0" y="95.0" width="12" height="12" rx="2" fill="#E24B4A" transform="rotate(270.0 210.0 101.0)"/><rect x="245.7" y="103.3" width="12" height="12" rx="2" fill="#378ADD" transform="rotate(292.5 251.7 109.3)"/><rect x="281.1" y="126.9" width="12" height="12" rx="2" fill="#E24B4A" transform="rotate(315.0 287.1 132.9)"/><rect x="304.7" y="162.3" width="12" height="12" rx="2" fill="#378ADD" transform="rotate(337.5 310.7 168.3)"/></g>
<circle cx="210" cy="210" r="80" fill="#FAC775" stroke="#BA7517" stroke-width="1.5"/>
<circle cx="210" cy="210" r="13" fill="#808080"/>
<g fill="#808080"><circle cx="210" cy="20" r="3.5"/><circle cx="326" cy="250" r="3.5"/><circle cx="311" cy="168" r="3.5"/><circle cx="250" cy="190" r="3.5"/><circle cx="218" cy="216" r="3.5"/></g>
<g stroke="#999999" stroke-width="0.8"><line x1="210" y1="20" x2="430" y2="40"/><line x1="326" y1="250" x2="430" y2="260"/><line x1="311" y1="168" x2="430" y2="130"/><line x1="250" y1="190" x2="430" y2="195"/><line x1="218" y1="216" x2="430" y2="330"/></g>
<g font-family="Arial, sans-serif" fill="#808080">
<text x="436" y="44" font-size="14" font-weight="bold">Spokes</text><text x="436" y="62" font-size="12">connect the shell to the rim</text>
<text x="436" y="134" font-size="14" font-weight="bold">Magnets</text><text x="436" y="152" font-size="12">red and blue: north and south</text>
<text x="436" y="199" font-size="14" font-weight="bold">Stator: copper coils</text><text x="436" y="217" font-size="12">fixed, with hall sensors</text>
<text x="436" y="264" font-size="14" font-weight="bold">Shell</text><text x="436" y="282" font-size="12">spins, carries the magnets</text>
<text x="436" y="334" font-size="14" font-weight="bold">Axle</text><text x="436" y="352" font-size="12">fixed, bolted to the frame</text>
<text x="436" y="370" font-size="12">wires come out through it</text>
</g>
</svg>
