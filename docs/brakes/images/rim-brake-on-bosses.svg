<svg xmlns="http://www.w3.org/2000/svg" width="680" viewBox="0 0 680 420" role="img"><title>How a rim brake mounts on bosses (simplified)</title><desc>The rear wheel seen from behind. A boss sticks out of each seat stay below the brake pads. A brake arm pivots on each boss, and a cable pulls the arm tops together so the pads squeeze the rim.</desc>
<rect x="323" y="40" width="34" height="350" rx="17" fill="none" stroke="#808080" stroke-width="2"/>
<rect x="329" y="100" width="22" height="290" rx="4" fill="#B4B2A9" opacity="0.5"/>
<g stroke="#808080" stroke-width="6" stroke-linecap="round"><line x1="285" y1="30" x2="285" y2="400"/><line x1="395" y1="30" x2="395" y2="400"/></g>
<g stroke="#EF9F27" stroke-width="9" stroke-linecap="round"><line x1="262" y1="290" x2="282" y2="290"/><line x1="398" y1="290" x2="418" y2="290"/></g>
<g fill="#808080" opacity="0.55"><rect x="248" y="165" width="14" height="135" rx="5"/><rect x="418" y="165" width="14" height="135" rx="5"/></g>
<g stroke="#808080" stroke-width="2.5"><line x1="262" y1="240" x2="316" y2="240"/><line x1="418" y1="240" x2="364" y2="240"/></g>
<g fill="#444441"><rect x="316" y="230" width="13" height="20" rx="2"/><rect x="351" y="230" width="13" height="20" rx="2"/></g>
<line x1="255" y1="168" x2="425" y2="168" stroke="#378ADD" stroke-width="2.5"/>
<g fill="#808080"><circle cx="395" cy="80" r="3.5"/><circle cx="408" cy="290" r="3.5"/><circle cx="425" cy="210" r="3.5"/><circle cx="360" cy="168" r="3.5"/><circle cx="320" cy="240" r="3.5"/><circle cx="335" cy="340" r="3.5"/><circle cx="355" cy="60" r="3.5"/></g>
<g stroke="#999999" stroke-width="0.8"><line x1="395" y1="80" x2="470" y2="80"/><line x1="408" y1="290" x2="470" y2="300"/><line x1="425" y1="210" x2="470" y2="210"/><line x1="360" y1="168" x2="470" y2="140"/><line x1="320" y1="240" x2="200" y2="210"/><line x1="335" y1="340" x2="200" y2="350"/><line x1="355" y1="60" x2="200" y2="40"/></g>
<g font-family="Arial, sans-serif" font-size="13" fill="#808080">
<text x="476" y="84">Seat stay (frame tube)</text>
<text x="476" y="304">Boss: a post on the frame</text>
<text x="476" y="214">Brake arm: pivots on the boss</text>
<text x="476" y="144">Cable: pulls the arm tops in</text>
<text x="194" y="214" text-anchor="end">Brake pad</text>
<text x="194" y="354" text-anchor="end">Rim: the pads</text>
<text x="194" y="372" text-anchor="end">squeeze its sides</text>
<text x="194" y="44" text-anchor="end">Tire</text>
</g>
</svg>
